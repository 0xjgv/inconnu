name: Frozen eval

on:
  workflow_run:
    workflows: [Request frozen eval]
    types: [completed]
  push:
    branches: [main]

permissions: {}

jobs:
  evaluate:
    if: github.event_name == 'push' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.revisions.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Resolve the revisions from GitHub
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash evals/frozen_ci.sh
      - name: Compare the frozen corpus
        env:
          BASE: ${{ steps.revisions.outputs.base }}
          SHA: ${{ steps.revisions.outputs.sha }}
        run: |
          mkdir reports
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git rev-list --reverse --first-parent "$BASE..$SHA" > "$RUNNER_TEMP/frozen-shas"
            result=0
            while read -r candidate; do
              uv run --python 3.14.10 --no-project -- python -m evals.frozen_eval \
                "$(git rev-parse "$candidate^1")" "$candidate" --output "reports/$candidate.json" || result=1
            done < "$RUNNER_TEMP/frozen-shas"
            exit "$result"
          fi
          uv run --python 3.14.10 --no-project -- python -m evals.frozen_eval \
            "$BASE" "$SHA" --output "reports/$SHA.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-eval
          path: reports/*.json
          if-no-files-found: ignore

  publish:
    if: always() && needs.evaluate.outputs.sha != ''
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish the trusted result
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.evaluate.outputs.sha }}
          OUTCOME: ${{ needs.evaluate.result }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f context=frozen-eval \
            -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '{state, context}'
