[project]
name = "inconnu"
version = "0.2.0"
description = "Fast one-way redaction of PII and secrets in text and JSON"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "0xjgv", email = "juans.gaitan@gmail.com"}
]
license = {text = "MIT"}
keywords = ["privacy", "redaction", "pii", "secrets", "dlp", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Operating System :: OS Independent",
]
dependencies = [
    "phonenumberslite>=9.0.43",
]

[project.urls]
Homepage = "https://github.com/0xjgv/inconnu"
Repository = "https://github.com/0xjgv/inconnu"
Issues = "https://github.com/0xjgv/inconnu/issues"

[project.scripts]
inconnu = "inconnu.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
eval = [
    "detect-secrets>=1.5.0",
    "faker>=40.54.0",
]

[tool.ruff]
extend-exclude = ["evals/.baseline-venv"]

[tool.ruff.lint]
extend-select = ["I", "S"] # I: isort, S: bandit
select = ["E4", "E7", "E9", "F"]
ignore = ["S101"] # assert

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607", "S105", "S106"]
"evals/*" = ["S311", "S603", "S105", "S106"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inconnu"]
